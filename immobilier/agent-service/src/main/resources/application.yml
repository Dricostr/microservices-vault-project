server:
  port: 8083

spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${AGENT_DB_NAME:agent_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
```

