###############################################################
# IMMOBILIER - GitHub Actions
# Builds all 3 JARs and pushes them to Nexus
# Ansible is still run MANUALLY on VM1
###############################################################

name: Build Immobilier Services

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # ── Fetch Nexus credentials from Vault ────────────
      - name: Authenticate with Vault
        id: vault-login
        run: |
          VAULT_TOKEN=$(curl -sf \
            --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID }}\"}" \
            ${{ secrets.VAULT_ADDR }}/v1/auth/approle/login \
            | jq -r '.auth.client_token')
          echo "::add-mask::$VAULT_TOKEN"
          echo "token=$VAULT_TOKEN" >> $GITHUB_OUTPUT

      - name: Read Nexus credentials from Vault
        id: nexus-creds
        run: |
          CREDS=$(curl -sf \
            -H "X-Vault-Token: ${{ steps.vault-login.outputs.token }}" \
            ${{ secrets.VAULT_ADDR }}/v1/secret/data/nexus/deploy)
          NEXUS_USER=$(echo $CREDS | jq -r '.data.data.username')
          NEXUS_PASS=$(echo $CREDS | jq -r '.data.data.password')
          NEXUS_URL=$(echo $CREDS  | jq -r '.data.data.url')
          echo "::add-mask::$NEXUS_PASS"
          echo "user=$NEXUS_USER" >> $GITHUB_OUTPUT
          echo "pass=$NEXUS_PASS" >> $GITHUB_OUTPUT
          echo "url=$NEXUS_URL"   >> $GITHUB_OUTPUT

      # ── Write Maven settings.xml with Nexus auth ──────
      - name: Write Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ steps.nexus-creds.outputs.user }}</username>
                <password>${{ steps.nexus-creds.outputs.pass }}</password>
              </server>
              <server>
                <id>nexus-snapshots</id>
                <username>${{ steps.nexus-creds.outputs.user }}</username>
                <password>${{ steps.nexus-creds.outputs.pass }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # ── Build + push each service ──────────────────────
      - name: Build and publish property-service
        run: |
          cd immobilier/property-service
          mvn --batch-mode clean deploy -DskipTests \
            -Dnexus.url=${{ steps.nexus-creds.outputs.url }}

      - name: Build and publish booking-service
        run: |
          cd immobilier/booking-service
          mvn --batch-mode clean deploy -DskipTests \
            -Dnexus.url=${{ steps.nexus-creds.outputs.url }}

      - name: Build and publish agent-service
        run: |
          cd immobilier/agent-service
          mvn --batch-mode clean deploy -DskipTests \
            -Dnexus.url=${{ steps.nexus-creds.outputs.url }}

      # ── Summary ───────────────────────────────────────
      - name: Build summary
        run: |
          echo "✅ All 3 JARs built and pushed to Nexus"
          echo "➡️  Run Ansible manually on VM1 to deploy:"
          echo "    ansible-playbook -i inventory.yml main.yml --ask-vault-pass"
          echo "    Nexus URL: ${{ steps.nexus-creds.outputs.url }}"